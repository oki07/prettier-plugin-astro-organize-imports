name: ci

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'npm'
      - run: npm install --ignore-scripts
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - name: Lint workflows
        uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - prettier: '3.0'
            covers: peer floor
          - prettier: '3.8'
            covers: narrow print callback
          - prettier: '3.9'
            covers: wide print callback
          - prettier: 'next'
            covers: narrow again, and 4.x
    name: test (prettier ${{ matrix.prettier }}, ${{ matrix.covers }})
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'npm'
      - run: npm install --ignore-scripts
      - run: npm install --no-save --ignore-scripts prettier@${{ matrix.prettier }}
      - run: npm test
      - run: npm run test:standalone
