version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      dependencies:
        patterns:
          - '*'
    ignore:
      # TypeScript 7 does not ship `organizeImports`.
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
